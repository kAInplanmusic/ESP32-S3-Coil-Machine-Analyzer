[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Build options
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Wall
    -Wextra
    -O2
    -std=c++17
    -fno-exceptions
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Wl,--print-gc-sections
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO

; Memory configuration
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; PSRAM configuration
board_build.memory_type = qio_qspi
board_upload.maximum_size = 8388608

; Library dependencies
lib_deps =
    https://github.com/adafruit/Adafruit-GFX-Library.git
    https://github.com/adafruit/Adafruit_ILI9488.git
    https://github.com/morrissimo/ESP32-I2S-Slavemode.git
    https://github.com/kosme/arduinoFFT.git
    SdFat
    ArduinoBLE

; Serial monitor configuration
monitor_filters =
    time
    log2file
    colorize

; OTA update support
upload_protocol = esptool

; Debug configuration
debug_tool = esp-builtin
debug_init_break = tbreak setup

[env:release]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
inherit_from = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -O3
    -DNDEBUG

[env:debug]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
inherit_from = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -O0
    -g
    -DDEBUG_BUILD

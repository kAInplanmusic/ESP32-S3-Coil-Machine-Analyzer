[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

# Core libraries
lib_deps =
    # TFT Display
    bodmer/TFT_eSPI@^2.5.31
    # I2S Audio
    esp32-i2s-slvs-rec=https://github.com/espressif/esp-idf.git#master
    # DSP & FFT
    kishorekumar/ESP32IdfSoc@^0.3.0
    # SD Card
    greiman/SdFat@^2.2.2
    # WiFi & Web
    bblanchon/ArduinoJson@^6.21.2
    # Sensors
    jrowberg/MPU6050@^0.12.0
    
# Build flags
build_flags =
    -DCONFIG_IDF_TARGET_ESP32S3
    -DCONFIG_ESP32S3_DEFAULT_CPU_FREQ_240
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -fno-strict-aliasing
    -Wno-missing-field-initializers

# Optimization
build_unflags = 
    -O2
build_flags = 
    ${env:esp32-s3-devkitc-1.build_flags}
    -O3
    -funroll-loops

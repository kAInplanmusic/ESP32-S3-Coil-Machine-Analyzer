name: Build Desktop App Installers

on:
  push:
    branches:
      - copilot/windows-linux-android-webapp
    paths:
      - 'desktop-app/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'desktop-app/package-lock.json'

      - name: Install dependencies
        working-directory: desktop-app
        run: npm install

      - name: Build Linux AppImage
        working-directory: desktop-app
        run: npm run build-linux

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: desktop-app/dist/*.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'desktop-app/package-lock.json'

      - name: Install dependencies
        working-directory: desktop-app
        run: npm install

      - name: Build Windows Installer
        working-directory: desktop-app
        run: npm run build-win

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop-app/dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'desktop-app/package-lock.json'

      - name: Install dependencies
        working-directory: desktop-app
        run: npm install

      - name: Build macOS DMG
        working-directory: desktop-app
        run: npm run build

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop-app/dist/*.dmg
